<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subjects | MedStudy Hub</title>
    <meta name="description" content="Explore Mathematics, Science, English, and Computer Science study subjects with MedStudy Hub.">
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <nav class="navbar">
        <a href="index.html" class="logo">🧠 MedStudy Hub</a>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="study.html">Study</a>
        </div>
    </nav>
</header>

<section class="learning-section">
    <p class="section-number">01</p>
    <h1>📖 My Subjects</h1>
    <p class="section-intro">Choose a subject and start learning.</p>
    <input type="text" id="subjectInput" placeholder="Add a subject...">

<button onclick="addSubject()">➕ Add Subject</button>

<ul id="subjectList"></ul>

   
</section>

<footer>
    <h2>🧠 MedStudy Hub</h2>
    <p>LEARN • BUILD • SOLVE</p>
    <p class="copyright">© 2026 MedStudy Hub</p>
</footer>
<script>

function addSubject() {

    const input = document.getElementById("subjectInput");
    const subject = input.value.trim();

    if (subject === "") return;

    let subjects =
        JSON.parse(localStorage.getItem("medstudySubjects")) || [];

    subjects.push(subject);

    localStorage.setItem(
        "medstudySubjects",
        JSON.stringify(subjects)
    );

    input.value = "";

    showSubjects();
}


function showSubjects() {

    const subjects =
        JSON.parse(localStorage.getItem("medstudySubjects")) || [];

    const list = document.getElementById("subjectList");

    list.innerHTML = "";

    subjects.forEach(function(subject) {

        const li = document.createElement("li");

        li.textContent = "📚 " + subject;

        list.appendChild(li);

    });
}


showSubjects();

</script>
</body>
</html>
