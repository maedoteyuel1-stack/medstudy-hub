<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Saved | MedStudy Hub</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <nav class="navbar">
        <a href="index.html" class="logo">🧠 MedStudy Hub</a>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="study.html">Study</a>
        </div>
    </nav>
</header>

<section class="learning-section">

    <p class="section-number">MY SPACE</p>

    <h1>🗂️ My Saved</h1>

    <p class="section-intro">
        Everything you've saved in one place.
    </p>

    <div class="system-grid">

        <div class="system-card">
            <span>📝</span>
            <h3>My Notes</h3>
            <p id="notesPreview">No saved notes yet.</p>
        </div>

        <div class="system-card">
            <span>✅</span>
            <h3>My Tasks</h3>
            <p id="tasksPreview">No saved tasks yet.</p>
        </div>

        <div class="system-card">
            <span>💡</span>
            <h3>Business Ideas</h3>
            <p id="ideasPreview">No saved ideas yet.</p>
        </div>

        <div class="system-card">
            <span>🎯</span>
            <h3>My Goals</h3>
            <p id="goalsPreview">No saved goals yet.</p>
        </div>

    </div>

</section>

<footer>
    <h2>🧠 MedStudy Hub</h2>
    <p>LEARN • BUILD • SOLVE</p>
    <p class="copyright">© 2026 MedStudy Hub</p>
</footer>

<script>
const notes = localStorage.getItem("medstudyNotes");

if (notes) {
    document.getElementById("notesPreview").textContent =
        notes.substring(0, 100) + "...";
}
</script>

</body>
</html>
