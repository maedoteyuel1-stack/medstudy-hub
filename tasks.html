<script>
function addTask() {
    const input = document.getElementById("taskInput");
    const taskText = input.value.trim();

    if (taskText === "") {
        return;
    }

    let tasks = JSON.parse(localStorage.getItem("medstudyTasks")) || [];

    tasks.push(taskText);
    localStorage.setItem("medstudyTasks", JSON.stringify(tasks));

    input.value = "";
    showTasks();
}

function showTasks() {
    const tasks = JSON.parse(localStorage.getItem("medstudyTasks")) || [];
    const list = document.getElementById("taskList");

    list.innerHTML = "";

    tasks.forEach(function(task) {
        const li = document.createElement("li");
        li.textContent = "✅ " + task;
        list.appendChild(li);
    });
}

showTasks();
</script>
