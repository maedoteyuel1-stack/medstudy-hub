<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Ideas | MedStudy Hub</title>
    <meta name="description" content="Explore business ideas and learn how to turn creative ideas into real projects with MedStudy Hub.">
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <nav class="navbar">
        <a href="index.html" class="logo">🧠 MedStudy Hub</a>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="business.html">Business</a>
        </div>
    </nav>
</header>

<section class="learning-section">

    <h1>💡 Business Ideas</h1>

    <p class="section-intro">
        Write down your ideas and turn them into real projects.
    </p>

    <textarea
        id="idea"
        rows="12"
        style="width:100%; padding:20px; border-radius:15px;"
        placeholder="Write your business idea here..."
    ></textarea>

    <br><br>

    <button id="saveIdeaButton">💾 Save Idea</button>

    <p id="saved"></p>

</section>

<footer>
    <h2>🧠 MedStudy Hub</h2>
    <p>LEARN • BUILD • SOLVE</p>
    <p class="copyright">© 2026 MedStudy Hub</p>
</footer>

<script>

const ideaInput = document.getElementById("idea");
const saveButton = document.getElementById("saveIdeaButton");
const savedMessage = document.getElementById("saved");


function saveIdea() {

    const idea = ideaInput.value.trim();

    if (idea === "") {
        savedMessage.textContent =
            "⚠️ Please write an idea first.";
        return;
    }

    localStorage.setItem("businessIdea", idea);

    savedMessage.textContent =
        "✅ Idea saved!";
}


saveButton.addEventListener("click", saveIdea);


window.addEventListener("DOMContentLoaded", function () {

    const savedIdea = localStorage.getItem("businessIdea");

    if (savedIdea) {

        ideaInput.value = savedIdea;

        savedMessage.textContent =
            "✅ Your saved idea";

    }

});

</script>

</body>
</html>
