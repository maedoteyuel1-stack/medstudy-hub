<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes | MedStudy Hub</title>
    <meta name="description" content="Write, organize, and save your study notes with MedStudy Hub.">
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <nav class="navbar">
        <a href="index.html" class="logo">🧠 MedStudy Hub</a>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="study.html">Study</a>
        </div>
    </nav>
</header>

<section class="learning-section">

    <p class="section-number">02</p>

    <h1>📝 My Notes</h1>

    <p class="section-intro">
        Write, organize and save your study notes.
    </p>

    <textarea
        id="notesInput"
        rows="15"
        style="width:100%; padding:20px; border-radius:15px;"
        placeholder="Start writing your notes here..."
    ></textarea>

    <button onclick="saveNotes()">💾 Save Notes</button>

    <p id="saveMessage"></p>

</section>

<footer>
    <h2>🧠 MedStudy Hub</h2>
    <p>LEARN • BUILD • SOLVE</p>
    <p class="copyright">© 2026 MedStudy Hub</p>
</footer>

<script>

function saveNotes() {

    const notes = document.getElementById("notesInput").value;

    localStorage.setItem("medstudyNotes", notes);

    document.getElementById("saveMessage").textContent =
        "✅ Notes saved!";
}


window.addEventListener("load", function () {

    const savedNotes = localStorage.getItem("medstudyNotes");

    if (savedNotes !== null) {
        document.getElementById("notesInput").value = savedNotes;
    }

});

</script>

</body>
</html>
